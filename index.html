<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="icons/logo.png" />
    <title>Nextcent</title>
  </head>
  <body>
    <header class="header">
      <div class="container header-container">
        <a class="header-logo" href="#!">
          <img class="logo-img" src="icons/logo.png" alt="Nexcent logo" />
          <h1 class="logo-text">Nexcent</h1>
        </a>
        <div class="header-right">
          <ul class="header-list">
            <li><a class="list-item" href="#!">Home</a></li>
            <li><a class="list-item" href="#!">Features</a></li>
            <li><a class="list-item" href="#!">Community</a></li>
            <li><a class="list-item" href="#!">Blog</a></li>
            <li><a class="list-item" href="#!">Pricing</a></li>
          </ul>
          <button class="header-btn">Register now</button>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container hero-container">
          <div class="hero-left">
            <h2 class="hero-title">
              Lessons and insights <br />
              <span>from 8 years</span>
            </h2>
            <p class="hero-text">
              Where to grow your business as a photographer: site or social
              media?
            </p>
            <button class="hero-btn">Register</button>
          </div>
          <div class="hero-right">
            <img src="images/header-bg.png " alt="" />
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
